<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #000; font-family: Pretendard, -apple-system, sans-serif; font-size: 14px; line-height: 1.4; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 24px 0 12px; border-bottom: 1px solid #000; }
  h1 { font-size: 15px; font-weight: 600; }
  nav button { font: inherit; background: none; border: 1px solid #000; color: #000; padding: 2px 10px; cursor: pointer; }
  nav button + button { margin-left: 4px; }
  .row { display: grid; grid-template-columns: 28px 22px 1fr; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid #e5e5e5; font-variant-numeric: tabular-nums; }
  .row.mon { border-top: 1px solid #000; margin-top: -1px; }
  .d { text-align: right; }
  .w { color: #666; font-size: 12px; }
  .wk .d, .wk .w { color: #aaa; }
  .past { color: #999; }
  .today .d, .today .w { background: #000; color: #fff; }
  .today .d { padding-right: 3px; }
  ul { list-style: none; }
  li { display: flex; gap: 8px; align-items: baseline; }
  li + li { margin-top: 3px; }
  .tab { align-self: stretch; width: 4px; flex-shrink: 0; }
  .sub { font-size: 12px; color: #666; white-space: nowrap; }
  .done .t { text-decoration: line-through; color: #999; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="month"></h1>
    <nav><button id="prev" aria-label="지난 달">←</button><button id="now">이번 달</button><button id="next" aria-label="다음 달">→</button></nav>
  </header>
  <main id="list"></main>
</div>
<script src="data.js"></script>
<script>
const NAMES = ['일', '월', '화', '수', '목', '금', '토'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
let offset = 0;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function row(d) {
  const key = iso(d);
  const items = TASKS.filter(t => t.date === key).map(t =>
    `<li class="${t.done ? 'done' : ''}"><span class="tab" style="background:${SUBJECTS[t.subject] || '#000'}"></span><span class="t">${esc(t.title)}</span><span class="sub">${esc(t.subject || '')}</span></li>`
  ).join('');
  const day = d.getDay();
  const cls = [day === 1 && d.getDate() > 1 ? 'mon' : '', day % 6 === 0 ? 'wk' : '',
    key === iso(today) ? 'today' : d < today ? 'past' : ''].join(' ');
  return `<div class="row ${cls}" id="d${key}"><span class="d">${d.getDate()}</span><span class="w">${NAMES[day]}</span><ul>${items}</ul></div>`;
}

function render() {
  const first = new Date(today.getFullYear(), today.getMonth() + offset, 1);
  const n = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  document.getElementById('month').textContent = `${first.getFullYear()}. ${first.getMonth() + 1}`;
  document.getElementById('list').innerHTML =
    Array.from({ length: n }, (_, i) => row(new Date(first.getFullYear(), first.getMonth(), i + 1))).join('');
}

document.getElementById('prev').onclick = () => { offset--; render(); };
document.getElementById('next').onclick = () => { offset++; render(); };
document.getElementById('now').onclick = () => { offset = 0; render(); };
render();
</script>
</body>
</html>
