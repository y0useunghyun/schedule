<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #000; font-family: Pretendard, -apple-system, sans-serif; font-size: 14px; line-height: 1.4; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 80px; }
  .row { display: grid; grid-template-columns: 32px 28px 1fr; gap: 12px; align-items: baseline; padding: 6px 8px; border-bottom: 1px solid #e5e5e5; font-variant-numeric: tabular-nums; }
  .head { position: sticky; top: 0; background: #fff; padding-top: 24px; border-bottom: 1px solid #000; font-size: 12px; color: #666; }
  .row.first { border-top: 1px solid #000; margin-top: -1px; }
  .m, .d { text-align: right; }
  .past { color: #999; }
  .today .d { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
  .row:not(.head):hover { background: #000; color: #fff; }
  .row:not(.head):hover .sub { color: #fff; }
  ul { list-style: none; }
  li { display: flex; gap: 8px; align-items: baseline; }
  li + li { margin-top: 3px; }
  .tab { align-self: stretch; width: 4px; flex-shrink: 0; }
  .sub { font-size: 12px; color: #666; white-space: nowrap; }
  .done .t { text-decoration: line-through; opacity: .5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row head"><span class="m">월</span><span class="d">일</span><span>일정</span></div>
  <main id="list"></main>
</div>
<script src="data.js"></script>
<script>
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
const todayKey = iso(today);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function row(d) {
  const key = iso(d);
  const items = TASKS.filter(t => t.date === key).map(t =>
    `<li class="${t.done ? 'done' : ''}"><span class="tab" style="background:${SUBJECTS[t.subject] || '#000'}"></span><span class="t">${esc(t.title)}</span><span class="sub">${esc(t.subject || '')}</span></li>`
  ).join('');
  const first = d.getDate() === 1;
  const cls = [first ? 'first' : '', key === todayKey ? 'today' : key < todayKey ? 'past' : ''].join(' ');
  return `<div class="row ${cls}" id="d${key}"><span class="m">${first ? d.getMonth() + 1 : ''}</span><span class="d">${d.getDate()}</span>${items ? `<ul>${items}</ul>` : '<span>-</span>'}</div>`;
}

// 범위: 이번 달(또는 가장 이른 일정의 달) 1일 ~ 다음 달(또는 가장 늦은 일정의 달) 말일
const dates = TASKS.map(t => t.date).sort();
const startKey = [dates[0], todayKey].filter(Boolean).sort()[0];
const endKey = [dates.at(-1), iso(new Date(today.getFullYear(), today.getMonth() + 1, 1))].filter(Boolean).sort().at(-1);
const [sy, sm] = startKey.split('-').map(Number);
const [ey, em] = endKey.split('-').map(Number);
const rows = [];
for (let d = new Date(sy, sm - 1, 1), end = new Date(ey, em, 0); d <= end; d.setDate(d.getDate() + 1)) rows.push(row(d));
document.getElementById('list').innerHTML = rows.join('');
document.getElementById('d' + todayKey)?.scrollIntoView({ block: 'center' });
</script>
</body>
</html>
