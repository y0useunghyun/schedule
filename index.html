<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #000; font-family: "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", sans-serif; font-size: 19px; line-height: 1.17; word-break: keep-all; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px 100vh; }
  h1 { font: inherit; }
  .head { position: sticky; top: 0; z-index: 1; background: #fff; padding: 32px 0 6px; cursor: default; }
  .head .m { white-space: nowrap; margin-left: -3em; }
  #list .row { scroll-margin-top: calc(38px + 1.17em); }
  .row { display: grid; grid-template-columns: 56px 34px 1fr; column-gap: 20px; align-items: baseline; font-variant-numeric: tabular-nums; cursor: text; }
  .m, .d { text-align: right; }
  .first { margin-top: 1.17em; }
  .past { color: #999; }
  .today .d { text-decoration: underline; text-underline-offset: 3px; }
  #list .row:hover { background: #000; color: #fff; }
  #list .row:focus-within { background: #fff; color: #000; }
  textarea { font: inherit; color: inherit; width: 100%; border: 0; outline: 0; resize: none; background: none; display: block; overflow: hidden; border-radius: 0; }
  textarea::placeholder { color: inherit; opacity: 1; }
  .bar { position: fixed; left: 16px; bottom: 12px; display: flex; gap: 4px; align-items: center; font: 11px Arial, sans-serif; }
  @media (max-width: 600px) { .row { grid-template-columns: 48px 22px 1fr; column-gap: 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="row head"><span class="m" id="ym"></span></h1>
  <main id="list"></main>
</div>
<div class="bar"><span id="status"></span></div>
<script src="data.js"></script>
<script>
const REPO = 'y0useunghyun/schedule';
const API = `https://api.github.com/repos/${REPO}/contents/data.js`;
const TOKEN_KEY = 'schedule-token';
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
const todayKey = iso(today);
let tasks = TASKS;

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
const line = t => (t.subject ? `${t.subject} - ` : '') + t.title;
const status = s => { document.getElementById('status').textContent = s; };
function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
function setToken(v) { try { localStorage.setItem(TOKEN_KEY, v); } catch {} }

function row(d) {
  const key = iso(d);
  const text = tasks.filter(t => t.date === key).map(line).join('\n');
  const first = d.getDate() === 1;
  const cls = [first ? 'first' : '', key === todayKey ? 'today' : key < todayKey ? 'past' : ''].join(' ');
  return `<div class="row ${cls}" data-date="${key}" id="d${key}"><span class="m">${first ? d.getMonth() + 1 : ''}</span><span class="d">${d.getDate()}</span><textarea rows="1" placeholder="-" aria-label="${key} 일정">${esc(text)}</textarea></div>`;
}

// 범위: 이번 달(또는 가장 이른 일정의 달) 1일 ~ 다음 달(또는 가장 늦은 일정의 달) 말일
function render() {
  const dates = tasks.map(t => t.date).sort();
  const startKey = [dates[0], todayKey].filter(Boolean).sort()[0];
  const endKey = [dates.at(-1), iso(new Date(today.getFullYear(), today.getMonth() + 1, 1))].filter(Boolean).sort().at(-1);
  const [sy, sm] = startKey.split('-').map(Number);
  const [ey, em] = endKey.split('-').map(Number);
  const rows = [];
  for (let d = new Date(sy, sm - 1, 1), end = new Date(ey, em, 0); d <= end; d.setDate(d.getDate() + 1)) {
    rows.push(row(d));
  }
  document.getElementById('list').innerHTML = rows.join('');
}

// 한 줄 = 「과목 - 일정」. 「 - 」가 없으면 과목 없이 일정만.
function parse(date, text) {
  return text.split('\n').map(s => s.trim()).filter(Boolean).map(s => {
    const i = s.indexOf(' - ');
    return i > 0 ? { date, subject: s.slice(0, i).trim(), title: s.slice(i + 3).trim() } : { date, subject: '', title: s };
  });
}

function toFile(list) {
  const sorted = [...list].sort((a, b) => a.date.localeCompare(b.date));
  return `// 사이트에서 날짜 줄을 눌러 고치면 이 파일이 자동으로 바뀜. 형식: JSON 배열.\nconst TASKS = [\n${sorted.map(t => JSON.stringify(t)).join(',\n')}\n];\n`;
}

const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));

async function save(next) {
  let token = getToken();
  if (!token) {
    // 폰 자동 대문자(Github_pat_)·공백 보정
    token = (prompt('XXXX') || '').replace(/\s/g, '').replace(/^(github_pat_|ghp_)/i, m => m.toLowerCase());
    if (!token) { status('저장 안 됨'); return false; }
    setToken(token);
  }
  status('저장 중…');
  const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };
  try {
    const cur = await fetch(API, { headers, cache: 'no-store' });
    if (cur.status === 401) { setToken(''); throw new Error('열쇠가 맞지 않아요'); }
    if (!cur.ok) throw new Error(`불러오기 실패 ${cur.status}`);
    const { sha } = await cur.json();
    const res = await fetch(API, { method: 'PUT', headers, body: JSON.stringify({ message: 'data: 사이트에서 수정', content: b64(toFile(next)), sha }) });
    if (!res.ok) throw new Error(`저장 실패 ${res.status}`);
    status('저장됨');
    return true;
  } catch (e) {
    status(e.message);
    return false;
  }
}

// 모든 날짜 칸이 항상 열린 입력칸. 칸 밖으로 나가면 그 날만 저장.
const autosize = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
const autosizeAll = () => document.querySelectorAll('#list textarea').forEach(autosize);
let queue = Promise.resolve();

const list = document.getElementById('list');
list.addEventListener('input', e => autosize(e.target));
list.addEventListener('focusout', e => {
  const ta = e.target;
  const date = ta.closest('.row').dataset.date;
  const before = tasks.filter(t => t.date === date).map(line).join('\n');
  if (ta.value.trim() === before.trim()) return;
  tasks = [...tasks.filter(t => t.date !== date), ...parse(date, ta.value)];
  const snapshot = tasks;
  queue = queue.then(() => save(snapshot));
});
addEventListener('resize', autosizeAll);
const goToday = () => document.getElementById('d' + todayKey)?.scrollIntoView({ block: 'start' });
// 위 「26.11」은 지금 맨 위에 걸린 줄의 달을 따라감
const ym = document.getElementById('ym');
function updateYm() {
  const head = ym.closest('.head').getBoundingClientRect();
  const r = document.elementFromPoint(head.left + 4, head.bottom + 4)?.closest('#list .row');
  const [y, m] = (r ? r.dataset.date : todayKey).split('-');
  ym.textContent = `${y.slice(2)}.${Number(m)}`;
}
addEventListener('scroll', updateYm, { passive: true });
render();
autosizeAll();
goToday();
updateYm();

// 토큰이 있으면 GitHub에서 최신본을 바로 받아옴(Pages 반영 1분 대기 없이)
const token = getToken();
if (token) {
  fetch(API, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.raw' }, cache: 'no-store' })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(txt => {
      if (document.activeElement?.tagName === 'TEXTAREA') return; // 쓰는 중이면 덮어쓰지 않음
      tasks = JSON.parse(txt.slice(txt.indexOf('['), txt.lastIndexOf(']') + 1));
      render(); autosizeAll();
    })
    .catch(() => {});
}
</script>
</body>
</html>
