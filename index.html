<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: #000; font-family: "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", sans-serif; font-size: 19px; line-height: 1.17; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 120px; }
  select { width: 100%; font: 11px Arial, sans-serif; margin-bottom: 28px; }
  .row { display: grid; grid-template-columns: 30px 34px 1fr; column-gap: 20px; align-items: baseline; font-variant-numeric: tabular-nums; }
  .m, .d { text-align: right; }
  .first { margin-top: 1.17em; }
  .past { color: #999; }
  .today .d { text-decoration: underline; text-underline-offset: 3px; }
  .row:hover { background: #000; color: #fff; }
  .done .t { text-decoration: line-through; }
  .bar { position: fixed; left: 16px; bottom: 12px; display: flex; gap: 4px; }
  .bar button { font: 11px Arial, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <select id="jump" aria-label="달 이동"></select>
  <main id="list"></main>
</div>
<div class="bar"><button id="top">back to top</button><button id="now">today</button></div>
<script src="data.js"></script>
<script>
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = new Date(); today.setHours(0, 0, 0, 0);
const todayKey = iso(today);

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function row(d) {
  const key = iso(d);
  const tasks = TASKS.filter(t => t.date === key);
  const titles = tasks.map(t => `<div class="${t.done ? 'done' : ''}"><span class="t">${esc(t.title)}</span></div>`).join('') || '-';
  const first = d.getDate() === 1;
  const cls = [first ? 'first' : '', key === todayKey ? 'today' : key < todayKey ? 'past' : ''].join(' ');
  return `<div class="row ${cls}" id="d${key}"><span class="m">${first ? d.getMonth() + 1 : ''}</span><span class="d">${d.getDate()}</span><div>${titles}</div></div>`;
}

// 범위: 이번 달(또는 가장 이른 일정의 달) 1일 ~ 다음 달(또는 가장 늦은 일정의 달) 말일
const dates = TASKS.map(t => t.date).sort();
const startKey = [dates[0], todayKey].filter(Boolean).sort()[0];
const endKey = [dates.at(-1), iso(new Date(today.getFullYear(), today.getMonth() + 1, 1))].filter(Boolean).sort().at(-1);
const [sy, sm] = startKey.split('-').map(Number);
const [ey, em] = endKey.split('-').map(Number);
const rows = [], months = [];
for (let d = new Date(sy, sm - 1, 1), end = new Date(ey, em, 0); d <= end; d.setDate(d.getDate() + 1)) {
  if (d.getDate() === 1) months.push(`<option value="d${iso(d)}">${d.getFullYear()}. ${d.getMonth() + 1}</option>`);
  rows.push(row(d));
}
document.getElementById('list').innerHTML = rows.join('');
const jump = document.getElementById('jump');
jump.innerHTML = months.join('');
jump.value = `d${todayKey.slice(0, 8)}01`;
jump.onchange = () => document.getElementById(jump.value).scrollIntoView();
document.getElementById('top').onclick = () => scrollTo(0, 0);
const goToday = () => document.getElementById('d' + todayKey)?.scrollIntoView({ block: 'center' });
document.getElementById('now').onclick = goToday;
goToday();
</script>
</body>
</html>
